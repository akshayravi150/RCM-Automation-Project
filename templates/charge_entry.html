<!DOCTYPE html>
<html>
<head>
    <title>Charge Entry</title>
</head>
<body>

    <h2>Charge Entry Page</h2>

    <form method="post">
        <label>Patient ID:</label>
        <input type="text" name="patient_id"><br><br>

        <label>CPT Code:</label>
        <input type="text" name="cpt_code"><br><br>

        <label>Charge Amount:</label>
        <input type="text" name="charge_amount"><br><br>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

    {% if success %}
        <h3 id="successMsg">Success ✅ Charge Submitted</h3>
    {% endif %}

</body>
</html>
